// Apply once in-game, then let archived settings preserve further tuning.
// Preserve HDR calibration, display resolution, ray quality and feature toggles.
set r_hdrAutoExposure 0
set r_hdrFixedLuminance 0.5
set r_forceAmbient 0.375
set r_rayTracedGIStrength 1.125
set r_rayTracedReflectionStrength 0.65
neuralHistoryReset
echo Doom contrast: fixed exposure, ambient 0.375, bounce 1.125, reflections 0.65
