// Optional: exec neural_rtx_keys.cfg in the console to install these bindings.
// Edit the key names here to use your preferred keyboard or mouse buttons.
bind F6 "toggle r_rayTracedGI; neuralHistoryReset"
bind F7 "toggle r_rayTracedAO; neuralHistoryReset"
bind F8 "toggle r_rayTracedContactShadows; neuralHistoryReset"
bind F10 "rayTracingDebugCycle"
bind F11 "rayTracingToggle"
echo RTX keys: F6 material bounce, F7 AO, F8 contacts, F10 debug views, F11 all RTX
