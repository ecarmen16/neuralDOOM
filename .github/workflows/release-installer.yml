name: Build release installer

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'milestone-[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main (for example v0.2.0)
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-installer.yml'
      - 'tools/neural-rendering/Test-NeuralDoom-PublicSource.ps1'
      - 'tools/neural-rendering/Test-PublicSourceAudit.ps1'

permissions:
  contents: read

concurrency:
  group: release-installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source-audit:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test ordinary and mapped-root source audits
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/neural-rendering/Test-PublicSourceAudit.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Source audit regression tests failed.' }
          if (Test-Path R:\) { throw 'Neutral build drive R: is already in use.' }
          subst R: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map neutral build path.' }
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File R:\tools\neural-rendering\Test-NeuralDoom-PublicSource.ps1 -RepoRoot R:\
            if ($LASTEXITCODE -ne 0) { throw 'Mapped-root repository audit failed.' }
          } finally { subst R: /D }

  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact tag with pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate release source
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^(v[0-9][A-Za-z0-9._-]*|milestone-[0-9][A-Za-z0-9._-]*)$') { throw 'Invalid release tag.' }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checkout.' }
          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $revision) { throw 'Checkout must match the existing tag.' }
          git merge-base --is-ancestor $revision origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit merged into main.' }
          "tag=$($env:RELEASE_TAG)" >> $env:GITHUB_OUTPUT
          "commit=$revision" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test source audit path handling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/neural-rendering/Test-PublicSourceAudit.ps1

      - name: Build, test and package both engines
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if (Test-Path R:\) { throw 'Neutral build drive R: is already in use.' }
          subst R: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map neutral build path.' }
          'NEURAL_BUILD_DRIVE_MAPPED=1' >> $env:GITHUB_ENV
          & R:\tools\neural-rendering\Build-CloudRelease.ps1 -RepoRoot R:\ -Version $env:RELEASE_TAG -Parallel 4

      - name: Preserve verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-installer
          path: releases/${{ steps.version.outputs.tag }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove neutral drive mapping
        if: always()
        run: |
          if ($env:NEURAL_BUILD_DRIVE_MAPPED -eq '1') { subst R: /D }

  draft-release:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-installer
          path: release-assets

      - name: Attach assets to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^(v[0-9][A-Za-z0-9._-]*|milestone-[0-9][A-Za-z0-9._-]*)$') { throw 'Invalid release tag.' }
          $expected = @("neuralDOOM-$($env:RELEASE_TAG).zip", "neuralDOOM-Setup-$($env:RELEASE_TAG).exe")
          $files = @(Get-ChildItem release-assets -File)
          if ($files.Count -ne 4) { throw 'Expected installer, portable ZIP and their checksums.' }
          foreach ($name in $expected) {
            $path = Join-Path release-assets $name
            $checksum = (Get-Content -LiteralPath ($path + '.sha256') -Raw).Trim()
            $expectedLine = (Get-FileHash -LiteralPath $path).Hash + '  ' + $name
            if ($checksum -cne $expectedLine) { throw "Checksum mismatch: $name" }
          }
          $remoteCommit = gh api "repos/$($env:GH_REPO)/commits/$($env:RELEASE_TAG)" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $remoteCommit -ne $env:SOURCE_COMMIT) { throw 'Release tag changed during the build.' }
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'Release is already published. Use a new tag; assets will not be replaced.' }
            if ($release.assets.Count) { throw 'Draft already has assets. Inspect it before retrying; nothing will be overwritten.' }
          } else {
            $notes = "Source: $($env:SOURCE_COMMIT). Built on GitHub-hosted Windows from the tagged source. Includes native RTX and SDK-enabled engines with corresponding source. Game data, textures and optional runtimes are acquired during installation. Review these assets and release notes before publishing."
            $notes | Set-Content release-notes.md -Encoding utf8
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "neuralDOOM $($env:RELEASE_TAG)" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release upload $env:RELEASE_TAG @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          "Draft release ready: https://github.com/$($env:GH_REPO)/releases" >> $env:GITHUB_STEP_SUMMARY
